<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b2e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma DP">
<title>App équestre by MGM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE  tendre et pratique : un carnet perso qu'on ouvre à l'écurie, qui la tutoie
   IDEA   le carnet de demi-pension, un par cheval, rangés dans un tiroir latéral
   PICTURE la photo du cheval en grand médaillon, puis le calendrier du mois
   COLOUR bai profond (robe) en bandeau, blanc, rose vif de flot de concours ; bleu pour les soins
   TYPE   Gloock pour titres et chiffres, Figtree pour le reste
   LAYOUT appli mobile : bandeau, une colonne, tiroir à gauche, onglets en bas */
:root{color-scheme:light dark;
--bg:light-dark(#faf8f6,#15100d);--card:light-dark(#fff,#211915);--ink:light-dark(#2a1810,#f4ece6);
--mute:light-dark(#7d695c,#b39f93);--line:light-dark(#ebe1d8,#3a2d26);--tint:light-dark(#f2e7df,#2d221c);
--bay:light-dark(#5b2e1a,#3b2014);--bay2:light-dark(#7a4227,#5b3321);
--rose:light-dark(#d1356a,#ff7ca5);--rosebg:light-dark(#fde6ee,#4a1e2d);
--sky:light-dark(#2d6aa8,#86b8ec);--skybg:light-dark(#e3eefa,#1b2b3d);--warn:light-dark(#bf3324,#ff8a7a);
--ease:cubic-bezier(.2,.8,.2,1)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:8;background:var(--bay);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) max(4vw,14px) 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.who{display:flex;align-items:center;gap:10px;border:0;background:#ffffff14;border-radius:999px;padding:4px 14px 4px 4px;min-height:48px;color:#fff;text-align:left;transition:background .2s}
.who:active{background:#ffffff2a}
.av{width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--bay2);flex:none;display:block}
.av img,.av svg{width:100%;height:100%;object-fit:cover;display:block}
.who small{display:block;font-size:13px;opacity:.75;line-height:1.1}
.who b{display:block;font:400 20px/1.1 Gloock,serif;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who svg.chev{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.2;opacity:.8}
.st{font-size:13px;display:inline-flex;align-items:center;gap:6px;opacity:.9}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:#f5c36b}
.st[data-m=ok]::before{background:#7ee0a6}.st[data-m=err]::before,.st[data-m=ro]::before{background:#ff8a7a}
.st[data-m=local]{display:none}
main{max-width:760px;margin:0 auto;padding:16px max(4vw,14px) calc(110px + env(safe-area-inset-bottom))}
main.enter>*{animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
main.swap{animation:swap .5s var(--ease) both}
main{touch-action:pan-y}
button,a,label,select{touch-action:manipulation}
main.fromR{animation:fromR .38s var(--ease) both}main.fromL{animation:fromL .38s var(--ease) both}
@keyframes fromR{from{opacity:.2;transform:translateX(42px)}}@keyframes fromL{from{opacity:.2;transform:translateX(-42px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes swap{from{opacity:0;transform:translateX(-24px)}}
h2{font:400 26px/1.1 Gloock,serif;margin:22px 0 10px;text-wrap:balance}
h3{font:400 22px/1.15 Gloock,serif;margin:0}
h4{font-size:16px;margin:18px 0 8px}
p{margin:0}
.mute{color:var(--mute)}.sm{font-size:14px}
.hero{background:var(--bay);color:#fff;margin:-16px calc(-1*max(4vw,14px)) 6px;padding:12px max(4vw,14px) 26px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;border-radius:0 0 28px 28px}
.photo{width:clamp(120px,34vw,190px);aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--bay2);border:4px solid #ffffff2e;display:block;cursor:pointer;position:relative;box-shadow:0 12px 30px #0005;transition:transform .3s var(--ease)}
.photo:active{transform:scale(.96)}
.photo img,.photo svg{width:100%;height:100%;object-fit:cover;display:block}
.photo .add{position:absolute;inset:auto 0 12% 0;text-align:center;font-size:13px;font-weight:600}
.kick{font-size:14px;opacity:.8}
.hname{font:400 clamp(34px,8vw,48px)/1.02 Gloock,serif;margin:2px 0 4px;color:#fff;overflow-wrap:anywhere}
.hero .sub{opacity:.85;font-size:15px}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:#ffffff17;border-radius:16px;padding:10px 12px}
.stat b{display:block;font:400 28px/1.1 Gloock,serif;white-space:nowrap}
.stat span{font-size:13px;opacity:.85}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;display:block;width:100%;text-align:left;transition:transform .2s var(--ease),box-shadow .2s}
button.card:active{transform:scale(.985)}
@media(hover:hover){button.card:hover{box-shadow:0 6px 20px #2a18100f}}
.big{font:400 30px/1.1 Gloock,serif}.cap::first-letter{text-transform:uppercase}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--rose);color:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s var(--ease),filter .2s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.wide{width:100%}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.fab{position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:0;background:var(--rose);color:#fff;font-size:32px;line-height:1;box-shadow:0 10px 26px #d1356a66;z-index:6;transition:transform .3s var(--ease),opacity .3s}
.fab:active{transform:scale(.9) rotate(90deg)}
.fab[hidden]{display:block;opacity:0;transform:scale(.4);pointer-events:none}
.tabs{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom);z-index:7;--x:0}
.tabs::before{content:"";position:absolute;top:7px;left:calc(var(--x)*20% + 10% - 28px);width:56px;height:32px;border-radius:999px;background:var(--rosebg);transition:left .4s var(--ease)}
.tabs button{position:relative;border:0;background:none;min-height:62px;font-size:12px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding-top:4px;transition:color .25s}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--ease)}
.tabs [aria-current]{color:var(--rose)}.tabs [aria-current] svg{transform:translateY(-1px) scale(1.08)}
.chip{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:999px;background:var(--rosebg);color:var(--rose);font-size:13px;font-weight:600;white-space:nowrap}
.chip.sky{background:var(--skybg);color:var(--sky)}.chip.warn{background:var(--warn);color:#fff}.chip.plain{background:var(--tint);color:var(--ink)}
.scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.scroll button{flex:none;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;transition:background .25s,color .25s}
.scroll button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ses{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;align-items:start}
.dnum{font:400 32px/1 Gloock,serif;text-align:center}
.dnum small{display:block;font:600 13px Figtree,sans-serif;color:var(--mute);margin-top:4px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px}
.hearts{display:inline-flex;gap:1px;vertical-align:middle}
.hearts svg,.rate svg{width:16px;height:16px;fill:var(--line)}.hearts svg.on{fill:var(--rose)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:14px;color:var(--mute);align-items:center}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:20px 2px 8px;font-weight:700}
.mhead span{font-weight:500;color:var(--mute);font-size:14px}
.empty{text-align:center;padding:28px 16px;color:var(--mute)}
.empty b{display:block;font:400 22px Gloock,serif;color:var(--ink);margin-bottom:6px}
.row2{display:flex;gap:12px;align-items:center;padding:10px 12px}
.row2 .grow{flex:1;border:0;background:none;text-align:left;padding:4px 0;min-height:44px}
.ck{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;padding:0;transition:background .25s,border-color .25s}
.ck.on{background:var(--rose);border-color:var(--rose)}
.ck.on::after{content:"";width:9px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg);animation:pop .35s var(--ease)}
@keyframes pop{from{transform:translateY(-2px) rotate(45deg) scale(0)}}
.ttl{font-weight:600}.done .ttl{text-decoration:line-through;color:var(--mute)}
.sec{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:24px 0 10px}
.sec h2{margin:0}
.sec .btn{min-height:40px;padding:0 14px;font-size:15px}
details summary{cursor:pointer;color:var(--mute);font-weight:600;padding:10px 2px;min-height:44px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 10px}
.mnav h2{margin:0;text-transform:capitalize}
.mnav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{text-align:center;font-size:13px;color:var(--mute);font-weight:600;padding:4px 0}
.cd{aspect-ratio:1/1.08;border-radius:12px;border:2px solid transparent;background:var(--card);display:flex;flex-direction:column;align-items:center;padding-top:6px;font-weight:600;position:relative;font-size:15px;transition:transform .2s var(--ease)}
.cd:active{transform:scale(.92)}
.cd.fix{background:var(--tint)}
.cd.plan{border:2px dashed var(--rose)}
.cd.done{background:var(--bay);color:#fff;border-color:var(--bay)}
.cd.past:not(.done){color:var(--mute)}
.cd.today span{background:var(--rose);color:#fff;border-radius:999px;padding:0 7px}
.cd i{position:absolute;bottom:7px;width:7px;height:7px;border-radius:50%;background:var(--sky)}
.cd.done i{background:#fff}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute);margin:10px 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend em{width:14px;height:14px;border-radius:4px;display:inline-block}
dl{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr);gap:8px 14px;margin:0}
dt{color:var(--mute);font-size:14px}dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.fhead{display:flex;gap:16px;align-items:center;margin:16px 0}
.fhead .photo{width:110px;border-color:var(--line);background:var(--tint)}
.fhead .photo .add{color:var(--ink);inset:40% 0 auto}
.budget{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.budget div{background:var(--tint);border-radius:14px;padding:10px 12px}
.budget b{display:block;font:400 24px/1.15 Gloock,serif;white-space:nowrap}
.budget span{font-size:13px;color:var(--mute)}
.ep{background:var(--bay);color:#fff;border:0;padding:18px}
.ep .mute{color:#ffffffb8}
.ep-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.epn{display:block;font:400 clamp(40px,11vw,56px)/1 Gloock,serif;margin-top:4px;white-space:nowrap}
.ep .btn.ghost{color:#fff;border-color:#ffffff55}
.bar{height:12px;border-radius:999px;background:#ffffff26;overflow:hidden;margin:16px 0 8px}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#ff9bbb,var(--rose));transition:width .8s var(--ease)}
.ep-btns{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:14px}
.ep-btns .btn:first-child{background:#fff;color:var(--bay)}
.mini{height:5px;border-radius:999px;background:var(--tint);overflow:hidden;margin-top:8px}
.mini i{display:block;height:100%;background:var(--rose);border-radius:inherit}
main:is(.enter,.fromR,.fromL,.swap) .bar i,main:is(.enter,.fromR,.fromL,.swap) .mini i{animation:grow 1s var(--ease) both .15s}
@keyframes grow{from{width:0}}
.mv{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;border-top:1px solid #ffffff22;background:none;color:#fff;padding:10px 0;min-height:46px;text-align:left}
.mv b{white-space:nowrap}
input,select,textarea{width:100%;font:16px Figtree,sans-serif;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);transition:border-color .2s}
textarea{resize:vertical;min-height:80px}
.fld{margin:0 0 14px;border:0;padding:0}
.fld label,.fld legend{display:block;font-size:14px;font-weight:600;margin-bottom:6px;padding:0}
.togs{display:flex;flex-wrap:wrap;gap:6px}
.tog input{position:absolute;opacity:0;pointer-events:none}
.tog span{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-size:15px;cursor:pointer;transition:background .2s,color .2s,transform .15s}
.tog span:active{transform:scale(.95)}
.tog input:checked+span{background:var(--rose);border-color:var(--rose);color:#fff}
.tog input:focus-visible+span{outline:2px solid var(--rose)}
.rate{display:flex;gap:4px}
.rate button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;padding:0}
.rate svg{width:22px;height:22px;transition:fill .2s,transform .3s var(--ease)}.rate button.on svg{fill:var(--rose);transform:scale(1.12)}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:45;animation:fade .25s both;transition:opacity .2s}
.ov.out{opacity:0}.ov.out .sheet{transform:translateY(40px);transition:transform .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--card);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));animation:up .38s var(--ease)}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
@keyframes up{from{transform:translateY(60%)}}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.x{width:44px;height:44px;border:0;background:var(--tint);border-radius:50%;font-size:24px}
.sh-a{display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:-18px;background:var(--card);padding:10px 0}
.sh-a .btn:last-child{flex:1;max-width:260px}
.line{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 2px;min-height:48px;text-align:left}
.toast{position:fixed;left:50%;bottom:calc(152px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 18px;display:flex;gap:10px;align-items:center;z-index:50;max-width:92vw;font-size:15px;transform:translate(-50%,0);transition:transform .35s var(--ease),opacity .25s;box-shadow:0 10px 30px #0003}
.toast[hidden]{display:flex;opacity:0;transform:translate(-50%,24px);pointer-events:none}
.toast button{border:0;background:var(--rose);color:#fff;border-radius:999px;min-height:36px;padding:0 14px;font-weight:600;white-space:nowrap}
.dr{position:fixed;inset:0;z-index:15;pointer-events:none}
.dr-bg{position:absolute;inset:0;background:#0009;opacity:0;transition:opacity .35s;border:0;width:100%;padding:0}
.dr-p{position:absolute;inset:0 auto 0 0;width:min(330px,86vw);background:var(--bg);transform:translateX(-102%);transition:transform .42s var(--ease);padding:calc(env(safe-area-inset-top) + 18px) 14px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.dr.open .dr-p{box-shadow:12px 0 40px #0004}
.dr.open{pointer-events:auto}.dr.open .dr-bg{opacity:1}.dr.open .dr-p{transform:none}
.dr h3{margin:4px 6px 12px;font-size:28px}
.hitem{display:flex;align-items:center;gap:12px;width:100%;border:1px solid transparent;background:none;border-radius:18px;padding:8px;text-align:left;min-height:64px;transition:background .2s,transform .2s var(--ease)}
.hitem:active{transform:scale(.98)}
.hitem .av{width:52px;height:52px;background:var(--bay2)}
.hitem[aria-current]{background:var(--card);border-color:var(--line);box-shadow:0 4px 16px #2a18100d}
.hitem[aria-current] .av{outline:3px solid var(--rose);outline-offset:2px}
.hitem b{display:block;font:400 20px/1.15 Gloock,serif}
.hitem span span{font-size:13px;color:var(--mute)}
.dr.open .hitem,.dr.open .dr-add{animation:slin .45s var(--ease) both;animation-delay:calc(var(--i,0)*50ms + 80ms)}
@keyframes slin{from{opacity:0;transform:translateX(-20px)}}
.dr-add{margin-top:8px;border:2px dashed var(--line);background:none;border-radius:18px;min-height:56px;font-weight:600;color:var(--rose)}
.dr-foot{margin-top:auto;padding:16px 6px 0;font-size:13px;color:var(--mute)}

.thumb{width:56px;height:56px;border-radius:14px;object-fit:cover;flex:none;background:var(--tint)}
.grow.wt{display:flex;gap:12px;align-items:center}
.lk{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--ink)}
.lk svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.phf{display:flex;gap:12px;align-items:center}
.phf .pv{width:84px;height:84px;border-radius:16px;background:var(--tint);overflow:hidden;display:grid;place-items:center;color:var(--mute);font-size:13px;flex:none}
.phf .pv img{width:100%;height:100%;object-fit:cover}
.phf label.btn{cursor:pointer;display:inline-flex;margin:0;font-size:15px;padding:0 16px}
.phf .btn{min-height:42px}
.wx{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center;background:linear-gradient(160deg,var(--skybg),var(--card) 70%)}
.wxi{width:64px;height:64px}
.wxt{font:400 40px/1 Gloock,serif}
.advice{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:15px;grid-column:1/-1}
.advice b{color:var(--rose)}
.wday{display:grid;grid-template-columns:48px 40px minmax(0,1fr);gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.wday .wxi{width:40px;height:40px}
.wday p{font-size:14px}
ol.steps{margin:8px 0 0;padding-left:22px}ol.steps li{margin-bottom:8px}
.pgroup h4{display:flex;justify-content:space-between;gap:10px;margin:0 0 4px}
.pgroup h4 span{color:var(--mute);font-weight:500;font-size:14px}
.chk{display:flex;gap:12px;align-items:flex-start;width:100%;border:0;background:none;text-align:left;padding:9px 0;min-height:44px}
.chk .ck{width:26px;height:26px;margin-top:1px}
.chk.on>span{color:var(--mute);text-decoration:line-through}
.pring{width:96px;height:96px;flex:none}
main:is(.enter,.fromR,.fromL,.swap) .pring circle+circle{animation:dash 1.1s var(--ease) both .15s}
@keyframes dash{from{stroke-dasharray:0 999}}
.phero{display:flex;gap:16px;align-items:center;background:var(--bay);color:#fff;border-radius:22px;padding:18px;margin:16px 0 6px}
.phero .mute{color:#ffffffb8}
.qs{margin:8px 0 0;padding-left:20px;font-size:15px}.qs li{margin-bottom:6px}
details.card summary{padding:0;min-height:0;color:var(--ink)}

let WXS={status:'idle'};
async function getWx(loc){
  const key='madp-wx-'+(+loc.lat).toFixed(2)+','+(+loc.lon).toFixed(2);
  try{const c=JSON.parse(localStorage.getItem(key)||'null');if(c&&Date.now()-c.at<36e5)return c.d}catch(e){}
  const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${+loc.lat}&longitude=${+loc.lon}&current=temperature_2m,weather_code,wind_speed_10m,precipitation&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max&timezone=auto&forecast_days=5`);
  if(!r.ok)throw 0;const d=await r.json();if(!d.daily)throw 0;
  try{localStorage.setItem(key,JSON.stringify({at:Date.now(),d}))}catch(e){}
  return d;
}
function ensureWx(){
  const loc=H().loc;if(!loc)return;const key=loc.lat+','+loc.lon;
  if(WXS.key===key&&WXS.status!=='idle'&&!(WXS.status==='ok'&&Date.now()-WXS.at>36e5))return;
  WXS={key,status:'load'};
  getWx(loc).then(d=>{if(WXS.key!==key)return;WXS={key,status:'ok',d,at:Date.now()};if(tab==='home')render()})
    .catch(()=>{if(WXS.key!==key)return;WXS={key,status:'err'};if(tab==='home')render()});
}
function conseil(t,rain,wind,info){
  const tonte=COUV[info.tonte]?info.tonte:'Non tondu',box=info.vie==='Au box';
  const eff=Math.round(t)-(box?0:(wind>=30?3:0)+(rain>=1?2:0));
  let txt=COUV[tonte].find(([th])=>eff>=th)[1];
  if(box&&!txt.startsWith('pas'))txt+=", en couverture d'écurie (pas besoin d'imperméable au box)";
  else if(!box&&rain>=1&&!txt.startsWith('pas'))txt+=', imperméable (pluie ou neige prévue)';
  return txt;
}

/* ---------- agenda ---------- */
function calEvents(){
  const ev=[];
  for(const h of S.horses){const nm=hName(h),jours=h.dp.jours||[];
    jours.forEach(j=>{const di=DAYS.indexOf(j);if(di<0)return;let d=TODAY;while(dow(d)!==di)d=addDays(d,1);
      ev.push({key:`f-${h.id}-${di}`,sig:'f',date:d,rr:['MO','TU','WE','TH','FR','SA','SU'][di],sum:`DP avec ${nm}`,desc:h.dp.ecurie||'',al:'PT8H'})});
    Object.entries(h.plans).forEach(([d,p])=>{if(d<TODAY)return;if(!p.type&&!p.note&&jours.includes(DAYS[dow(d)]))return;
      ev.push({key:`p-${h.id}-${d}`,sig:d+(p.type||'')+(p.note||''),date:d,sum:`${p.type||'Séance'} avec ${nm}`,desc:p.note||'',al:'PT8H'})});
    h.soins.forEach(s=>{if(s.done||!s.date||s.date<TODAY)return;
      ev.push({key:`s-${s.id}`,sig:s.date+s.titre,date:s.date,sum:`${s.titre} – ${nm}`,desc:[s.cat,s.qui,s.notes].filter(Boolean).join(' · '),al:'-PT6H'})});
  }
  return ev;
}
const calNew=()=>calEvents().filter(e=>S.cal.sent[e.key]!==e.sig);
const calNudge=m=>S.cal.on&&calNew().length?toast(m,()=>calExport(false),"Mettre à l'agenda"):toast(m);
function icsText(evs){
  const e=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
  const st=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//app dp by mgm//FR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Ma DP'];
  for(const v of evs){
    L.push('BEGIN:VEVENT',`UID:${v.key}@app-dp-by-mgm`,`DTSTAMP:${st}`,`DTSTART;VALUE=DATE:${v.date.replace(/-/g,'')}`,`DTEND;VALUE=DATE:${addDays(v.date,1).replace(/-/g,'')}`);
    if(v.rr)L.push(`RRULE:FREQ=WEEKLY;BYDAY=${v.rr}`);
    L.push(`SUMMARY:${e(v.sum)}`);if(v.desc)L.push(`DESCRIPTION:${e(v.desc)}`);
    L.push('BEGIN:VALARM',`TRIGGER:${v.al}`,'ACTION:DISPLAY',`DESCRIPTION:${e(v.sum)}`,'END:VALARM','END:VEVENT');
  }
  L.push('END:VCALENDAR');return L.join('\r\n');
}
function calExport(all){
  const evs=all?calEvents():calNew();
  if(!evs.length){toast('Ton agenda est déjà à jour');return}
  const txt=icsText(evs),ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/calendar;charset=utf-8'}));if(!ios)a.download='ma-dp-agenda.ics';document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
  catch(e){toast("Impossible d'ouvrir l'agenda");return}
  evs.forEach(v=>S.cal.sent[v.key]=v.sig);S.cal.on=true;S.cal.asked=true;save();
  toast(`${evs.length} événement${evs.length>1?'s':''} envoyé${evs.length>1?'s':''} à ton agenda`);
}
function openCal(first){
  const n=calNew().length,all=calEvents().length;
  if(first){S.cal.asked=true;save()}
  const top=`<p>${first?'Tu veux retrouver ta DP dans le calendrier de ton téléphone ? ':''}L'app y ajoute tes jours de DP, tes séances prévues et tes soins (maréchal, vermifuge…), avec un rappel.</p><p class="mute sm" style="margin-top:8px">Ton téléphone va te proposer de les ajouter à ton calendrier. Ensuite, quand tu prévois quelque chose de nouveau, l'app te proposera de l'ajouter aussi.</p>
  ${n?`<button type="button" class="btn wide" data-calgo style="margin:16px 0 8px">Ajouter à mon agenda (${n})</button>`:!S.cal.on?'<button type="button" class="btn wide" data-calon style="margin:16px 0 8px">Oui, lier mon agenda</button>':'<button type="button" class="btn wide" style="margin:16px 0 8px" disabled>Ton agenda est à jour</button>'}${S.cal.on&&all?'<button type="button" class="btn ghost wide" data-calall>Tout renvoyer</button>':''}`;
  openForm(first?'Lier ton agenda':'Mon agenda',[],{},()=>{},{top,okGhost:1,okLabel:first?'Plus tard':'Fermer',onClick:(e,close)=>{
    if(e.target.closest('[data-calgo]')){close();calExport(false)}
    if(e.target.closest('[data-calon]')){close();S.cal.on=true;S.cal.asked=true;save();toast("C'est noté : à chaque séance ou soin prévu, l'app te proposera de l'ajouter")}
    if(e.target.closest('[data-calall]')){close();calExport(true)}}});
}

const monthNav=()=>`<div class="mnav"><button data-a="rm" data-id="-1" aria-label="Mois précédent">‹</button><h2>${esc(monthLabel(rym))}</h2><button data-a="rm" data-id="1" aria-label="Mois suivant"${rym>=TODAY.slice(0,7)?' disabled':''}>›</button></div>`;
const avgTxt=v=>v?v.toFixed(1).replace('.',',')+' / 5':'—';
function recapData(h,m){
  const ses=h.sessions.filter(s=>(s.date||'').startsWith(m)).sort((a,b)=>a.date<b.date?-1:1);
  const rh=ses.filter(s=>+s.rh),types={},moods={};
  ses.forEach(s=>{types[s.type||'Séance']=(types[s.type||'Séance']||0)+1;(s.mood||[]).forEach(x=>moods[x]=(moods[x]||0)+1)});
  const plans=Object.keys(h.plans).filter(d=>d.startsWith(m));
  return{ses,types,moods,plans,mins:ses.reduce((t,s)=>t+(+s.duree||0),0),avg:rh.length?rh.reduce((t,s)=>t+ +s.rh,0)/rh.length:0,
    planDone:plans.filter(d=>h.sessions.some(s=>s.date===d)).length,
    soins:h.soins.filter(s=>s.done&&(s.doneOn||s.date||'').startsWith(m)),sante:(h.sante||[]).filter(s=>(s.date||'').startsWith(m))};
}

  ${top.length?`<h4>Ce qu'on a travaillé</h4><div class="chips">${top.map(([t,n])=>`<span class="chip">${esc(t)} · ${n}</span>`).join('')}</div>`:''}

/* ---------- stats ---------- */
function vStats(){
  const h=H(),months=[];for(let i=11;i>=0;i--){const d=parse(TODAY.slice(0,7)+'-01');d.setMonth(d.getMonth()-i);months.push(iso(d).slice(0,7))}
  const per=months.map(m=>h.sessions.filter(s=>(s.date||'').startsWith(m))),all=per.flat();
  if(!all.length)return`<div class="sec"><h2>Mes stats</h2></div><div class="empty"><b>Pas encore de stats</b>Note tes séances avec ${esc(hName(h))} : les graphiques apparaîtront ici.</div>`;
  const mx=Math.max(1,...per.map(a=>a.length)),mins=all.reduce((t,s)=>t+(+s.duree||0),0),rhs=all.filter(s=>+s.rh);
  const avg=rhs.length?rhs.reduce((t,s)=>t+ +s.rh,0)/rhs.length:0,types={},moods={};
  all.forEach(s=>{types[s.type||'Séance']=(types[s.type||'Séance']||0)+1;(s.mood||[]).forEach(x=>moods[x]=(moods[x]||0)+1)});
  const tt=Object.entries(types).sort((a,b)=>b[1]-a[1]);
  const avgM=per.map(a=>{const r=a.filter(s=>+s.rh);return r.length?r.reduce((t,s)=>t+ +s.rh,0)/r.length:0});
  const lab=m=>parse(m+'-01').toLocaleDateString('fr-FR',{month:'narrow'});
  const bars=(vals,f,cls)=>`<div class="vbars">${vals.map((v,i)=>`<div class="vb" title="${esc(monthLabel(months[i]))}"><span>${f(v)}</span><div class="col"><i class="${cls}" style="height:${v/(cls?5:mx)*100}%"></i></div><em>${esc(lab(months[i]))}</em></div>`).join('')}</div>`;
  return`<div class="sec"><h2>Mes stats</h2></div><p class="mute sm" style="margin:-4px 2px 12px">${esc(hName(h))} · 12 derniers mois</p>
  <div class="budget"><div>${num('s-n',all.length)}<span>séances</span></div><div><b>${dur(mins)||'—'}</b><span>au total</span></div><div><b>${(all.length/12).toFixed(1).replace('.',',')}</b><span>séances par mois en moyenne</span></div><div><b>${avgTxt(avg)}</b><span>comment je l'ai trouvé</span></div></div>
  <h4>Séances par mois</h4><div class="card">${bars(per.map(a=>a.length),v=>v||'','')}</div>
  ${rhs.length?`<h4>Comment je l'ai trouvé, mois par mois</h4><div class="card">${bars(avgM,v=>v?v.toFixed(1).replace('.',','):'','alt')}</div>`:''}
  <h4>Par type de séance</h4><div class="card">${tt.map(([t,n])=>`<div class="hrow"><span>${esc(t)}</span><div class="hb"><i style="width:${n/tt[0][1]*100}%"></i></div><b>${n}</b></div>`).join('')}</div>
  ${Object.keys(moods).length?`<h4>Son humeur la plus fréquente</h4><div class="chips">${Object.entries(moods).sort((a,b)=>b[1]-a[1]).map(([t,n])=>`<span class="chip plain">${esc(t)} · ${n}</span>`).join('')}</div>`:''}`;
}

/* ---------- dépenses ---------- */
function depData(m){
  const items=[];
  for(const h of S.horses){const nm=hName(h);
    if(+h.dp.prix&&(!h.dp.debut||h.dp.debut.slice(0,7)<=m)&&m<=TODAY.slice(0,7))items.push({t:'Demi-pension · '+nm,cat:'Demi-pension',v:+h.dp.prix});
    h.soins.forEach(s=>{if(s.done&&s.qui==='Moi'&&+s.cout&&(s.doneOn||s.date||'').startsWith(m))items.push({t:`${s.titre} · ${nm}`,cat:'Soins',v:+s.cout,d:s.doneOn||s.date,a:'esoin',id:s.id,hid:h.id})});
    (h.sante||[]).forEach(s=>{if(+s.cout&&(s.date||'').startsWith(m))items.push({t:`${s.titre} · ${nm}`,cat:'Soins',v:+s.cout,d:s.date,a:'esante',id:s.id,hid:h.id})});
  }
  S.achats.forEach(a=>{if(a.done&&+a.prix&&(a.doneOn||'').startsWith(m))items.push({t:a.nom,cat:'Achats',v:+a.prix,d:a.doneOn,a:'eachat',id:a.id})});
  S.dep.forEach(x=>{if((x.date||'').startsWith(m))items.push({t:x.titre,cat:x.cat||'Autre',v:+x.montant||0,d:x.date,a:'edep',id:x.id})});
  const cats={};items.forEach(i=>cats[i.cat]=(cats[i.cat]||0)+i.v);
  return{items,cats,total:items.reduce((t,i)=>t+i.v,0)};
}
function vDep(){
  const d=depData(rym),cs=Object.entries(d.cats).sort((a,b)=>b[1]-a[1]),mx=cs.length?cs[0][1]:1;
  const months=[];for(let i=5;i>=0;i--){const x=parse(rym+'-01');x.setMonth(x.getMonth()-i);months.push(iso(x).slice(0,7))}
  const tot=months.map(m=>depData(m).total),tm=Math.max(1,...tot),yr=rym.slice(0,4);
  const ytot=Array.from({length:12},(_,i)=>`${yr}-${pad(i+1)}`).filter(m=>m<=TODAY.slice(0,7)).reduce((t,m)=>t+depData(m).total,0);
  const items=[...d.items].sort((a,b)=>(a.d||'0')<(b.d||'0')?1:-1);
  return`<div class="sec"><h2>Mes dépenses</h2><button class="btn" data-a="newdep">+ Dépense</button></div>${monthNav()}
  <div class="card ep"><span class="mute sm">Total du mois</span>${num('dep',Math.round(d.total),'eur').replace('<b ','<b class="epn" ')}<p class="sm mute" style="margin-top:8px">${eur(Math.round(ytot))} depuis le début de ${yr}</p></div>
  ${cs.length?`<h4>Par catégorie</h4><div class="card">${cs.map(([c,v])=>`<div class="hrow"><span>${esc(c)}</span><div class="hb"><i style="width:${v/mx*100}%"></i></div><b>${eur(Math.round(v))}</b></div>`).join('')}</div>`:''}
  <h4>Les 6 derniers mois</h4><div class="card"><div class="vbars" style="grid-template-columns:repeat(6,minmax(0,1fr))">${tot.map((v,i)=>`<div class="vb"><span>${v?Math.round(v)+' €':''}</span><div class="col"><i style="height:${v/tm*100}%"></i></div><em>${esc(parse(months[i]+'-01').toLocaleDateString('fr-FR',{month:'short'}))}</em></div>`).join('')}</div></div>
  <h4>Le détail</h4>${items.length?items.map(i=>{const inner=`<div style="flex:1"><span class="ttl">${esc(i.t)}</span><div class="meta" style="margin-top:2px"><span>${esc(i.cat)}</span><span>${i.d?fd(i.d):'chaque mois'}</span></div></div><b style="white-space:nowrap">${eur(i.v)}</b>`;
    return i.a&&(!i.hid||i.hid===S.cur)?`<button class="card" style="display:flex;gap:12px;align-items:center" data-a="${i.a}" data-id="${i.id}">${inner}</button>`:`<div class="card" style="display:flex;gap:12px;align-items:center">${inner}</div>`}).join(''):'<div class="card mute">Aucune dépense ce mois-ci.</div>'}
  <p class="mute sm" style="margin:8px 2px">La DP, les soins à ta charge et les achats cochés s'ajoutent tout seuls. Ajoute le reste (cours, concours, transport…) avec + Dépense.</p>`;
}

async function api(path,opts={},token){
  const res=await fetch(SUPA_URL+path,{...opts,headers:{apikey:SUPA_KEY,'Content-Type':'application/json',Authorization:'Bearer '+(token||SUPA_KEY),...(opts.headers||{})}});
  const txt=await res.text();let data=null;try{data=txt?JSON.parse(txt):null}catch(e){}
  if(!res.ok){const err=new Error((data&&(data.msg||data.message||data.error_description||data.error))||('Erreur '+res.status));err.status=res.status;throw err}
  return data;
}
function saveSession(d,prenom){
  const md=d.user.user_metadata||{};
  USER={id:d.user.id,email:d.user.email,prenom:prenom||md.prenom||'',token:d.access_token,refresh:d.refresh_token,exp:Date.now()+(+d.expires_in||3600)*1000};
  LSJ.set('madp-user',USER);
}
async function sess(){
  if(!USER)return null;
  if(USER.exp&&Date.now()<USER.exp-60000)return USER;
  try{const d=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:USER.refresh})});
    USER={...USER,token:d.access_token,refresh:d.refresh_token,exp:Date.now()+d.expires_in*1000};LSJ.set('madp-user',USER);return USER}
  catch(e){if(e.status===400||e.status===401){USER=null;LSJ.set('madp-user',null);showAuth('login','Ta session a expiré : reconnecte-toi.')}return null}
}
const DOCS='/rest/v1/budget_docs';
async function putDoc(key,data){const u=await sess();if(!u)throw new Error('session');
  await api(DOCS+'?on_conflict=user_id,key',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:u.id,key,data,updated_at:new Date().toISOString()})},u.token)}
async function delDoc(key){const u=await sess();if(!u)throw new Error('session');await api(DOCS+'?key=eq.'+encodeURIComponent(key),{method:'DELETE'},u.token)}
async function getDoc(key){const u=await sess();if(!u)throw new Error('session');const r=await api(DOCS+'?select=data&key=eq.'+encodeURIComponent(key),{},u.token);return r&&r[0]?r[0].data:null}
async function cloudPush(){
  if(!USER)return;if(cloudBusy){cloudAgain=true;return}
  cloudBusy=true;LSJ.set('madp-pending',1);
  try{await putDoc('dp-state',{t:S.t,s:S});LSJ.set('madp-pending',null);setStatus('ok')}catch(e){setStatus('err')}
  cloudBusy=false;if(cloudAgain){cloudAgain=false;cloudPush()}
}
function phPush(k,img){
  if(!USER)return;
  (img?putDoc('dp-ph-'+k,{img}):delDoc('dp-ph-'+k)).catch(()=>{const q=LSJ.get('madp-phq',{});q[k]=1;LSJ.set('madp-phq',q)});
}
async function phFlush(){
  const q=LSJ.get('madp-phq',{});
  for(const k of Object.keys(q)){try{P[k]?await putDoc('dp-ph-'+k,{img:P[k]}):await delDoc('dp-ph-'+k);delete q[k]}catch(e){break}}
  LSJ.set('madp-phq',q);
}
async function cloudPull(){
  if(!USER)return;lastPull=Date.now();
  try{
    if(LSJ.get('madp-pending',null))await cloudPush();
    const r=await getDoc('dp-state');
    if(r&&r.s&&(r.t||0)>S.t){S=norm(r.s);S.t=r.t;keepLocal();render()}
    else if((!r||(r.t||0)<S.t)&&S.t>0)await cloudPush();
    else setStatus('ok');
    await phFlush();
    const u=await sess();if(!u)return;
    const rows=await api(DOCS+'?select=key&key=like.dp-ph-*',{},u.token)||[];
    const miss=rows.map(x=>x.key.slice(6)).filter(k=>!P[k]);
    for(const k of miss){const d=await getDoc('dp-ph-'+k);if(d&&d.img){P[k]=d.img;phStore(k,d.img)}}
    if(miss.length)render();
  }catch(e){setStatus('err')}
}

const friendly=m=>{const s=String(m||'').toLowerCase();
  if(s.includes('already')||s.includes('registered'))return'Un compte existe déjà avec cet e-mail : connecte-toi.';
  if(s.includes('invalid login')||s.includes('invalid credentials'))return'E-mail ou mot de passe incorrect.';
  if(s.includes('not confirmed'))return"Ton compte n'est pas encore activé : clique sur le lien reçu par e-mail.";
  if(s.includes('password'))return'Le mot de passe doit faire au moins 6 caractères.';
  if(s.includes('fetch')||s.includes('network')||s.includes('load failed'))return'Pas de connexion internet.';
  if(s.includes('rate')||s.includes('security purposes'))return'Trop d\'essais : attends une minute et recommence.';
  return m};
async function doAuth(e){
  e.preventDefault();
  const v=id=>{const x=$('#'+id);return x?x.value.trim():''},email=v('au-e'),pre=v('au-p'),pw=$('#au-w')?$('#au-w').value:'';
  const msg=(t,ok)=>{const m=$('#aum');if(m){m.textContent=t;m.classList.toggle('ok',!!ok)}},b=$('#aub');
  if(AMODE!=='newpass'&&!/^\S+@\S+\.\S+$/.test(email))return msg('Tape ton adresse e-mail.');
  if(AMODE!=='forgot'&&pw.length<6)return msg('Le mot de passe doit faire au moins 6 caractères.');
  if(AMODE==='signup'&&!pre)return msg('Tape ton prénom.');
  b.disabled=true;b.textContent='Un instant…';
  try{
    if(AMODE==='login'){const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password:pw})});saveSession(d);await afterLogin();return}
    if(AMODE==='signup'){const d=await api('/auth/v1/signup?redirect_to='+encodeURIComponent(SITE),{method:'POST',body:JSON.stringify({email,password:pw,data:{prenom:pre}})});
      if(d&&d.access_token){saveSession(d,pre);await afterLogin();return}
      showAuth('login','Compte créé ! Ouvre l’e-mail qu’on vient de t’envoyer, clique sur le lien pour l’activer, puis connecte-toi ici.',true);$('#au-e').value=email;return}
    if(AMODE==='forgot'){await api('/auth/v1/recover?redirect_to='+encodeURIComponent(SITE),{method:'POST',body:JSON.stringify({email})});msg('C’est envoyé ! Regarde tes e-mails (et les spams) et clique sur le lien.',true)}
    if(AMODE==='newpass'){await api('/auth/v1/user',{method:'PUT',body:JSON.stringify({password:pw})},USER&&USER.token);await afterLogin();toast('Mot de passe changé');return}
  }catch(err){msg(friendly(err.message))}
  if(b.isConnected){b.disabled=false;b.textContent=AUTHT[AMODE][1]}
}
async function afterLogin(){
  const owner=LSJ.get('madp-owner',null);
  if(owner&&owner!==USER.id){S=blank();P={};keepLocal();if(idb)await idbDo('readwrite',st=>st.clear());try{localStorage.removeItem('madp2-ph')}catch(e){}LSJ.set('madp-phq',{})}
  else if(!owner){const q={};Object.keys(P).forEach(k=>q[k]=1);LSJ.set('madp-phq',q)}
  LSJ.set('madp-owner',USER.id);
  tab='home';render();showPicker();hideAuth();setStatus('wait');
  await cloudPull();
  if(!S.me.prenom&&USER.prenom){S.me.prenom=USER.prenom;save()}
  if(!$('#pick').hidden&&!$('#pick').classList.contains('picking')&&pickSig()!==pickShown)showPicker();
}
async function handleHash(){
  const h=location.hash;if(!h.includes('access_token')&&!h.includes('error'))return false;
  const p=new URLSearchParams(h.slice(1));history.replaceState(null,'',location.pathname+location.search);
  if(!p.get('access_token')){showAuth('login','Le lien a expiré : connecte-toi ou redemande un lien.');return true}
  try{const u=await api('/auth/v1/user',{},p.get('access_token'));
    saveSession({user:u,access_token:p.get('access_token'),refresh_token:p.get('refresh_token'),expires_in:p.get('expires_in')});
    if(p.get('type')==='recovery'){showAuth('newpass','Choisis ton nouveau mot de passe.',true);return true}
    await afterLogin();toast('Compte activé, bienvenue !');return true}
  catch(e){showAuth('login','Le lien a expiré : connecte-toi.');return true}
}
async function logout(){
  clearTimeout(save.tc);try{await cloudPush()}catch(e){}
  USER=null;LSJ.set('madp-user',null);LSJ.set('madp-owner',null);LSJ.set('madp-phq',{});LSJ.set('madp-pending',null);
  S=blank();P={};keepLocal();if(idb)await idbDo('readwrite',st=>st.clear());
  setStatus('local');drawer(false);showAuth('login','À bientôt !',true);render();
}

function countUp(){
  document.querySelectorAll('[data-n]').forEach(el=>{
    const k=el.dataset.k,to=+el.dataset.n,f=el.dataset.f,from=prevN[k]??0;prevN[k]=to;
    const fmt=v=>f==='eur'?eur(Math.round(v)):Math.round(v);
    if(RM||from===to){el.textContent=f==='eur'?eur(to):to;return}
    const t0=performance.now(),D=700;
    const step=t=>{const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=p<1?fmt(from+(to-from)*e):(f==='eur'?eur(to):to);if(p<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}

function readImg(file,cb,mx0=640){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const mx=mx0,sc=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};im.onerror=()=>toast('Photo illisible');im.src=r.result};
  r.readAsDataURL(file);
}

      if(x.done&&p&&sv>0){const amt=Math.min(p,sv);toast('Acheté !',()=>{S.ep.moves.push({id:nid(),date:TODAY,note:'Achat : '+x.nom,montant:-amt});save();toast(`${eur(amt)} pris sur l'épargne`)},`Payer avec l'épargne`)}

let tx=null,ty=0,tmode=null;
const mainEl=$('#main');
const snapBack=()=>{mainEl.style.transition='transform .3s var(--ease),opacity .3s';mainEl.style.transform='';mainEl.style.opacity='';setTimeout(()=>{mainEl.style.transition=''},320)};
document.addEventListener('touchstart',e=>{
  const p=e.touches[0],open=$('#dr').classList.contains('open');tx=null;tmode=null;
  if(document.querySelector('.ov')||!$('#pick').hidden||!$('#auth').hidden)return;
  if(open||p.clientX<24){tx=p.clientX;ty=p.clientY;tmode='drawer';return}
  if(!TABS.includes(tab)||e.target.closest('.scroll,input,textarea,select,.tabs,.fab,.top'))return;
  tx=p.clientX;ty=p.clientY;tmode=e.target.closest('.cal')?'cal':'pend';
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(tx==null||tmode==='drawer'||tmode==='cal')return;
  const p=e.touches[0],dx=p.clientX-tx,dy=p.clientY-ty;
  if(tmode==='pend'){if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.4)tmode='tab';else{if(Math.abs(dy)>12)tx=null;return}}
  if(RM)return;
  const i=TABS.indexOf(tab),edge=(dx>0&&i===0)||(dx<0&&i===TABS.length-1);
  mainEl.style.transition='none';mainEl.style.transform=`translateX(${(edge?dx*.15:dx*.5).toFixed(1)}px)`;mainEl.style.opacity=String(1-Math.min(.4,Math.abs(dx)/800));
},{passive:true});
document.addEventListener('touchend',e=>{
  if(tx==null)return;
  const p=e.changedTouches[0],dx=p.clientX-tx,dy=Math.abs(p.clientY-ty),open=$('#dr').classList.contains('open'),m=tmode;tx=null;tmode=null;
  if(m==='drawer'){if(dy<60){if(!open&&dx>60)drawer(true);else if(open&&dx<-60)drawer(false)}return}
  if(m==='cal'){if(Math.abs(dx)>60&&dy<50){const d=parse(ym+'-01');d.setMonth(d.getMonth()+(dx<0?1:-1));ym=iso(d).slice(0,7);render(dx<0?'fromR':'fromL')}return}
  if(m!=='tab')return;

  if(Math.abs(dx)>70&&ni>=0&&ni<TABS.length){tab=TABS[ni];render(dx<0?'fromR':'fromL');scrollTo({top:0})}else snapBack();
},{passive:true});
